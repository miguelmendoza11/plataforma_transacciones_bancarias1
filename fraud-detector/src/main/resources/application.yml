server:
  port: 8083
spring:
  application:
    name: fraud-detector
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-detector
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: com.banco.ledger.contracts.TransactionEventRecord
        spring.json.use.type.headers: false
        spring.json.trusted.packages: com.banco.ledger.contracts
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    hibernate:
      ddl-auto: update   # TODO: cambiar a validate cuando haya script SQL definitivo
    open-in-view: false
fraud:
  umbral-alto-valor: 10000
  frecuencia:
    max-transacciones: 5
    ventana-segundos: 60
management:
  endpoints:
    web:
      exposure:
        include: health,info
