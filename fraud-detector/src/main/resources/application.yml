server:
  port: 8083
spring:
  application:
    name: fraud-detector
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-detector
      auto-offset-reset: earliest
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    hibernate:
      ddl-auto: update   # TODO: cambiar a validate cuando haya script SQL definitivo
    open-in-view: false
fraud:
  umbral-alto-valor: 10000
  frecuencia:
    max-transacciones: 5
    ventana-segundos: 60
management:
  endpoints:
    web:
      exposure:
        include: health,info
