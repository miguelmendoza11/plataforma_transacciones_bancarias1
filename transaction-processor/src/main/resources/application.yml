server:
  port: 8082
spring:
  application:
    name: transaction-processor
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1                     # fair dispatch: un comando a la vez por worker
        default-requeue-rejected: false # tras agotar los reintentos va a la DLQ, no se reencola
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ledger}
    username: ${DB_USER:ledger}
    password: ${DB_PASSWORD:ledger}
  jpa:
    hibernate:
      ddl-auto: update   # TODO: cambiar a validate cuando haya script SQL definitivo
    open-in-view: false
ledger:
  monto-maximo: 100000   # maximo por transferencia; $20.000 se completa y lo marca el fraude
management:
  endpoints:
    web:
      exposure:
        include: health,info
